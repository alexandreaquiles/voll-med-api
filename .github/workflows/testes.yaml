name: Testes

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Os testes usam SQLite em memória e um Redis simulado: não precisam de .env nem de serviços
      - name: Run tests
        run: npm test

      - name: Compile
        run: npx tsc --noEmit
